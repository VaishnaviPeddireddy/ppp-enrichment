name: Build 1000 Clean Leads

on:
  schedule:
    # Every other day at 15:00 UTC (1,3,5… of each month).
    - cron: "0 15 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-1000:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build 1000 clean leads
        run: python -m src.ppp_enrichment.run_build_1000_clean_leads --target 1000

      - name: Commit 1000 clean leads output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage adds and deletions so incomplete CSVs are removed from the repo
          # when fewer than 1000 unique filtered leads are available.
          git add -A data/output/1000_clean_leads/
          git diff --staged --quiet || git commit -m "1000 clean leads: $(date +'%Y-%m-%d %H:%M UTC')"
          git push
