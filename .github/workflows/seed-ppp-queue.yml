name: Seed PPP queue (one-time)

# Run manually once after adding repo secret PPP_DATASET_URL (direct link to your PPP CSV).
# Splits the file into queue chunks and commits them to the repo for scheduled runs.
# Queue progress is tracked in git (not Actions cache).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download and split PPP dataset
        env:
          PPP_DATASET_URL: ${{ secrets.PPP_DATASET_URL }}
        run: |
          if [ -z "$PPP_DATASET_URL" ]; then
            echo "::error::Set repository secret PPP_DATASET_URL to a direct download URL for your PPP CSV."
            exit 1
          fi
          mkdir -p data/input/queue
          # Replace any existing queue chunks with a fresh split.
          rm -f data/input/queue/ppp-war_part*.csv
          curl -fsSL -o data/input/ppp-war.csv "$PPP_DATASET_URL"
          python -m src.ppp_enrichment.run_split_ppp_csv \
            --path data/input/ppp-war.csv \
            --rows 2000 \
            --out-dir data/input/queue
          rm -f data/input/ppp-war.csv
          echo "Created $(find data/input/queue -name 'ppp-war_part*.csv' | wc -l) chunk(s)."

      - name: Commit queue to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- data/input/queue/
          git diff --staged --quiet || git commit -m "seed: PPP queue chunks from dataset URL"
          git push
